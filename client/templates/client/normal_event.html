    {% load static %}
    <form method="post" id="normal-event-form">
        <input type="hidden" value="normal" name="service">
        <div class="row mb-3">
            {% csrf_token %}
                <div class="col-md-6">
                    {{form.event_start_date.label_tag}}
                    {{form.event_start_date}}
                </div>
                <div class="col-md-6">
                    {{form.is_all_day.label_tag}}
                    {{form.is_all_day}}
                </div>
                <div class="col-md-6">
                    {{form.event_start_time.label_tag}}
                    {{form.event_start_time}}
                </div>
                <div class="col-md-6">
                    {{form.event_end_time.label_tag}}
                    {{form.event_end_time}}
                </div>
                <div class="col-md-6 mt-4">
                    <button type="submit" class="btn btn-outline-primary">Save</button>
                    <a href="{% url 'reports' %}" class="btn btn-outline-secondary me-2">Cancel</a>
                </div>
        </div>
    </form>
